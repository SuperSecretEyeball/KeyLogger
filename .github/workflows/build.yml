name: Build KeyLogger EXE (Pure Win32 - Tray Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Create build directory
      run: mkdir build

    - name: Compile & Link (no console, uses main() with custom entry)
      working-directory: build
      shell: cmd
      run: |
        cl /nologo /EHsc /O2 /MD /std:c++17 /Zc:wchar_t /DNDEBUG ^
          /DUNICODE /D_UNICODE ^
          /W3 /wd4189 /wd4577 ^
          ..\main.cpp ^
          /link /NOLOGO /DYNAMICBASE /NXCOMPAT /OPT:REF /OPT:ICF ^
          /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup ^
          user32.lib shell32.lib gdi32.lib advapi32.lib ^
          /OUT:keyLogger.exe

    - name: Upload KeyLogger.exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: KeyLogger-Release
        path: build/keyLogger.exe
        if-no-files-found: error
