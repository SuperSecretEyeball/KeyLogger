name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC developer command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: vs2022  # or leave default

    - name: Create build directory
      run: mkdir build

    - name: Compile and link (pure Win32, no Qt)
      working-directory: build
      shell: cmd
      run: |
        cl /nologo /EHsc /O2 /MD /std:c++17 /Zc:wchar_t /DNDEBUG ^
          /DUNICODE /D_UNICODE ^
          /W3 /wd4577 /wd4189 ^
          ..\main.cpp ^
          /link /NOLOGO /DYNAMICBASE /NXCOMPAT /OPT:REF /OPT:ICF ^
          /SUBSYSTEM:WINDOWS ^
          user32.lib shell32.lib gdi32.lib advapi32.lib ^
          /OUT:keyLogger.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KeyLogger-Release
        path: build/keyLogger.exe
        if-no-files-found: error
